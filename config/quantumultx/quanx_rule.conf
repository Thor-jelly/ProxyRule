# ======================================
# Quantumult X 配置文件
# ======================================
# 官方示例 - https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/QuantumultX_Profiles.conf
# 参考配置 - https://raw.githubusercontent.com/w37fhy/QuantumultX/master/QuantumultX_diy.conf
# 规则来源 - https://github.com/blackmatrix7/ios_rule_script
# ======================================

[general]
# ======================================
# 通用设置
# ======================================

# > 节点延迟测试 URL
# Quantumult X 会对 server_check_url 指定的网址进行相应测试，以确认节点的可用性
# 你同样可以在 server_local/remote 中，为节点、订阅单独指定 server_check_url 参数
server_check_url=http://cp.cloudflare.com/generate_204

# > DNS 排除列表
# dns_exclusion_list 中的域名将不使用 fake-ip 方式，其它域名则全部采用 fake-ip 及远程解析的模式
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com

# > 节点地理位置检查
# 用于节点页面的节点信息展示，可完整自定义展示内容与方式
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js

# > 资源解析器
# 可用于自定义各类远程资源的转换，如节点、规则 filter、复写 rewrite 等
resource_parser_url=https://fastly.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js

# > 排除路由
# 下列表中的内容将不经过 QuantumultX 的处理
;excluded_routes=192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8
;icmp_auto_reply=true

# > UDP 白名单
# 留空则默认所有端口。不在 udp 白名单列表中的端口，将被丢弃处理（返回 ICMP "端口不可达" 信息）
;udp_whitelist=53, 80-427, 444-65535

[dns]
# ======================================
# DNS 设置
# ======================================
# 禁用系统 DNS 以及 IPv6
;no-system
;no-ipv6
# 支持参数 excluded_ssids、included_ssids 指定在特定 Wi-Fi 下失效/生效

# > DNS over HTTPS (DoH)
# DoH 服务器以加密的 HTTPS 协议进行 DNS 解析请求，避免原始 DNS 协议中用户的 DNS 解析请求被窃听或者修改的问题
# 设置 DoH 服务器后，所有其他常规 DNS 服务器设置将被忽略
# 阿里 DoH
doh-server=https://dns.alidns.com/dns-query

# > 如需使用 DoH3 (DNS over HTTP/3)，请开启下面参数
;prefer-doh3

# > 常规 DNS 服务器（如指定了 DoH，则以下设置失效）
# 并发响应，选取最优结果
server=119.29.29.29
server=223.5.5.5

# > DNS over QUIC (DoQ)
# 如指定了 DoQ 服务，则 DoH 以及其它 DNS 解析均失效
;doq-server=quic://dns.alidns.com

# ======================================
# 指定域名 DNS 服务器
# ======================================
# > 阿里系域名
server=/*.taobao.com/223.5.5.5
server=/*.tmall.com/223.5.5.5
server=/*.alipay.com/223.5.5.5
server=/*.aliyun.com/223.5.5.5

# > 腾讯系域名
server=/*.qq.com/119.28.28.28
server=/*.tencent.com/119.28.28.28
server=/*.weixin.com/119.28.28.28

# > 京东
server=/*.jd.com/119.28.28.28

# > 其他国内服务
server=/*.bilibili.com/119.29.29.29
server=/*.netease.com/119.29.29.29

# > Apple TestFlight
server=/*testflight.apple.com/23.76.66.98

[policy]
# ======================================
# 策略组定义
# ======================================
# 说明：
# - static: 静态策略组，手动选择节点/策略组
# - available: 可用策略组，按顺序选择第一个可用节点
# - round-robin: 轮询策略组，按列表顺序轮流使用节点
# - url-latency-benchmark: 延迟策略组，选取延迟最优节点
# - dest-hash: 哈希策略组，随机负载均衡，但相同域名走固定节点
# - ssid: SSID 策略组，根据设定的网络自动切换节点/策略组
# ======================================
# 图标说明：
# - img-url 参数用于指定策略组图标，可远程或本地 (Quantumult X/Images，108*108)
# - direct/proxy/reject 只能用本地图标 (direct.png, proxy.png, reject.png)
# ======================================

# > 主策略组（手动选择）
static=网速超快, 香港, 台湾, 日本, 韩国, 新加坡, 美国, PROXY, DIRECT, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Static.png

# > 自动选择（可选，默认关闭）
# 默认设置 10 分钟测速一次，当前使用节点延迟和最新测速延迟最低的节点相差 80ms 以上则切换
;url-latency-benchmark=自动选择, server-tag-regex=.*, check-interval=600, tolerance=80, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png

# > 地区分流策略组
# 香港节点
香港 = select, server-tag-regex=(?=.*(港|HK|(?i)Hong))^((?!(台湾|日本|新加坡|美国|韩国|狮城|南朝鲜|US|SG|JP|KR|TW|台灣|美國|韓國|獅城)).)*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png

# 台湾节点
台湾 = select, server-tag-regex=(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png

# 日本节点
日本 = select, server-tag-regex=(?=.*(日本|JP|(?i)Japan))^((?!(香港|台湾|新加坡|美国|韩国|狮城|南朝鲜|US|SG|KR|HK|TW|台灣|美國|韓國|獅城)).)*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png

# 韩国节点
韩国 = select, server-tag-regex=(?=.*(KR|Korea|KOR|首尔|韩|韓|(?i)Korea))^((?!(香港|台湾|新加坡|美国|狮城|南朝鲜|US|SG|HK|TW|台灣|美國|獅城)).)*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/KR.png

# 新加坡节点
新加坡 = select, server-tag-regex=(?=.*(新加坡|狮城|SG|(?i)Singapore))^((?!(香港|台湾|日本|美国|韩国|南朝鲜|US|JP|KR|HK|TW|台灣|美國|韓國)).)*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png

# 美国节点
美国 = select, server-tag-regex=(?=.*(美国|美國|US|洛杉矶|西雅图|(?i)States|American))^((?!(香港|台湾|日本|新加坡|韩国|狮城|南朝鲜|SG|JP|KR|HK|TW|台灣|韓國|獅城)).)*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png

